name: Bug report
description: Report a reproducible problem in the Go client
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: narad-go version or commit SHA
      placeholder: e.g. v0.1.0 or 3f90f76
    validations:
      required: true
  - type: input
    id: broker
    attributes:
      label: Narad broker version
      placeholder: e.g. v3.2.4
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: output of `go version`
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug and the impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: The smallest code that shows it, and the options the client was built with.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: The error values returned, and client logs if a logger was set.
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This does not disclose a security vulnerability.
          required: true

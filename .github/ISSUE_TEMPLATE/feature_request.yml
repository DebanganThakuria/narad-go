name: Feature request
description: Propose a change to the Go client
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      render: go
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: stdlib
    attributes:
      label: Dependencies
      options:
        - label: I understand the core narad package stays standard-library only; anything needing a third-party package goes in a package of its own.
          required: true

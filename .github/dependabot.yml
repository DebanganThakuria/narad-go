version: 2
updates:
  # The root module has no dependencies by design; only the metrics module
  # and the workflows have anything to update.
  - package-ecosystem: gomod
    directory: "/prometheus"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

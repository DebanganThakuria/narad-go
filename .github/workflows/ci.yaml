name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version the client declares, not the newest one, so that the
      # promise of supporting it stays true.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "gofmt: these files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      # The core package promises to import nothing beyond the standard
      # library. The Prometheus adapter is a separate package in this
      # module, so only programs that import it compile client_golang.
      - name: Core package is stdlib-only
        run: |
          deps="$(go list -deps -test -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -vE '^github\.com/debanganthakuria/narad-go(_test|\.test)?( \[|$)' || true)"
          if [[ -n "$deps" ]]; then
            echo "package narad imports packages outside the standard library:"
            echo "$deps"
            exit 1
          fi

      - name: Tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

# Known-advisory scanning, separate from CodeQL: govulncheck asks whether
# an advisory affects a dependency along a call path the code reaches.
#
# It runs on the newest stable Go, not the 1.23 that go.mod declares.
# Standard-library advisories belong to whatever toolchain an importer
# builds with, not to this library, and on 1.23 they would drown out
# what this scan is for: the module's own dependencies, which today are
# the Prometheus client behind the prometheus package.
#
# The weekly run matters as much as the pull-request run: advisories are
# published against dependencies that have not changed.
name: Vulnerability scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # Pinned so a new govulncheck release cannot start failing every
      # open pull request. The advisory data is fetched at scan time, so
      # the pin costs nothing in freshness.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan
        run: govulncheck ./...
